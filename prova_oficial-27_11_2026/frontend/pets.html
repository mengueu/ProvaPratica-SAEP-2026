<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pets – Clínica Veterinária</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="topo">
        <a class="marca" href="principal.html">Clínica Veterinária</a>
        <nav class="menu">
            <a href="principal.html">Início</a>
            <a href="tutores.html">Tutores</a>
            <a href="pets.html">Pets</a>
            <a href="agendamentos.html">Agendamentos</a>
        </nav>
        <div class="usuario">
            <span>Usuário: <strong id="nome-usuario"></strong></span>
            <button id="botao-sair" class="sair">Sair</button>
        </div>
    </header>

    <main class="conteudo">
        <div id="mensagem" class="aviso" hidden></div>

        <div class="barra-titulo">
            <h1>Pets</h1>
            <a class="btn" href="principal.html">&larr; Voltar à tela principal</a>
        </div>

        <section class="painel">
            <h2 id="titulo-formulario">Novo pet</h2>

            <form id="form-pet">
                <input type="hidden" id="id_pet">

                <div class="grade">
                    <div class="campo largo">
                        <label for="nome">Nome *</label>
                        <input type="text" id="nome" maxlength="100" required>
                    </div>
                    <div class="campo">
                        <label for="especie">Espécie *</label>
                        <input type="text" id="especie" maxlength="50" required placeholder="Ex.: Cachorro, Gato">
                    </div>
                    <div class="campo">
                        <label for="raca">Raça *</label>
                        <input type="text" id="raca" maxlength="100" required placeholder="Ex.: Golden Retriever">
                    </div>
                    <div class="campo">
                        <label for="peso">Peso (kg) *</label>
                        <input type="number" id="peso" min="0.01" max="99999.99" step="0.01" required>
                    </div>
                    <div class="campo">
                        <label for="id_tutor">Tutor *</label>
                        <select id="id_tutor" required>
                            <option value="">Selecione o tutor</option>
                        </select>
                    </div>
                    <div class="campo largo">
                        <label for="observacoes">Observações</label>
                        <input type="text" id="observacoes" maxlength="255" placeholder="Alergias, cuidados especiais, etc.">
                    </div>
                </div>

                <div class="acoes">
                    <button type="submit" id="botao-salvar" class="btn btn-primario">Cadastrar pet</button>
                    <button type="button" id="botao-cancelar" class="btn" hidden>Cancelar edição</button>
                </div>
            </form>
        </section>

        <section class="painel">
            <div class="barra-titulo">
                <h2>Pets cadastrados (<span id="total">0</span>)</h2>

                <form id="form-busca" class="busca">
                    <input type="search" id="busca" placeholder="Buscar por pet, espécie, raça, tutor ou observação">
                    <button type="submit" class="btn">Buscar</button>
                    <button type="button" id="botao-limpar-busca" class="btn">Limpar</button>
                </form>
            </div>

            <div class="rolagem">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th><th>Nome</th><th>Espécie</th><th>Raça</th><th>Peso</th>
                            <th>Observações</th><th>Tutor</th><th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="lista-pets"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="js/comum.js"></script>
    <script src="js/pets.js"></script>
</body>
</html>
